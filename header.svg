<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <!-- Animated gradient background -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1">
        <animate attributeName="stop-color" values="#0d1117;#161b22;#0d1117" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#03787C;stop-opacity:1">
        <animate attributeName="stop-color" values="#03787C;#014446;#03787C" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#014446;stop-opacity:1">
        <animate attributeName="stop-color" values="#014446;#03787C;#014446" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <!-- Glowing text filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Particle animation -->
    <radialGradient id="particle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#03787C;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#03787C;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" fill="url(#grad1)" rx="12"/>
  
  <!-- Animated particles -->
  <circle r="3" fill="#03787C" opacity="0.6">
    <animate attributeName="cx" values="50;750;50" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="30;170;30" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#03787C" opacity="0.4">
    <animate attributeName="cx" values="750;50;750" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="170;30;170" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#03787C" opacity="0.3">
    <animate attributeName="cx" values="400;100;700;400" dur="15s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="100;50;150;100" dur="15s" repeatCount="indefinite"/>
  </circle>
  <circle r="1.5" fill="#ffffff" opacity="0.5">
    <animate attributeName="cx" values="200;600;200" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="80;120;80" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="8s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Grid lines (subtle) -->
  <g opacity="0.08" stroke="#03787C" stroke-width="0.5">
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="500" y1="0" x2="500" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="700" y1="0" x2="700" y2="200"/>
  </g>
  
  <!-- Orbiting dots -->
  <g transform="translate(400,100)">
    <circle r="2.5" fill="#03787C" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="180;180" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="0;0" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.5" fill="#ffffff" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="120" to="480" dur="25s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="220;220" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="0;0" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="#03787C" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="240" to="600" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="160;160" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="0;0" dur="1s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Main text -->
  <text x="400" y="85" text-anchor="middle" font-family="JetBrains Mono, Fira Code, monospace" font-size="28" font-weight="bold" fill="#03787C" filter="url(#glow)">
    JULIAN FELIPE AFRICANO
  </text>
  <text x="400" y="120" text-anchor="middle" font-family="JetBrains Mono, Fira Code, monospace" font-size="14" fill="#c9d1d9" opacity="0.8">
    Backend &amp; AI Developer | Ingeniería de Sistemas @ Javeriana
  </text>
  
  <!-- Animated underline -->
  <rect x="250" y="135" width="300" height="2" fill="#03787C" rx="1" opacity="0.6">
    <animate attributeName="width" values="300;350;300" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="x" values="250;225;250" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Tech icons (simple) -->
  <g transform="translate(400,165)" text-anchor="middle" font-family="JetBrains Mono, Fira Code, monospace" font-size="11" fill="#8b949e">
    <text x="-120">Java</text>
    <text x="-60">Python</text>
    <text x="0">Kotlin</text>
    <text x="60">Spring</text>
    <text x="120">AI/ML</text>
  </g>
</svg>
