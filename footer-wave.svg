<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#03787C;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#014446;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#03787C;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#03787C;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#014446;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#03787C;stop-opacity:0.3"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="120" fill="#0d1117"/>
  
  <!-- Wave 1 -->
  <path fill="url(#waveGrad)" opacity="0.5">
    <animate attributeName="d" 
      values="M0,80 C150,60 350,100 500,80 C650,60 750,90 800,80 L800,120 L0,120 Z;
              M0,80 C150,100 350,60 500,80 C650,100 750,60 800,80 L800,120 L0,120 Z;
              M0,80 C150,60 350,100 500,80 C650,60 750,90 800,80 L800,120 L0,120 Z"
      dur="8s" repeatCount="indefinite"/>
  </path>
  
  <!-- Wave 2 -->
  <path fill="url(#waveGrad2)" opacity="0.3">
    <animate attributeName="d" 
      values="M0,90 C200,70 300,110 500,90 C700,70 750,100 800,90 L800,120 L0,120 Z;
              M0,90 C200,110 300,70 500,90 C700,110 750,70 800,90 L800,120 L0,120 Z;
              M0,90 C200,70 300,110 500,90 C700,70 750,100 800,90 L800,120 L0,120 Z"
      dur="6s" repeatCount="indefinite"/>
  </path>
  
  <!-- Floating particles -->
  <circle r="1.5" fill="#03787C" opacity="0.6">
    <animate attributeName="cx" values="100;700;100" dur="20s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="40;80;40" dur="20s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="20s" repeatCount="indefinite"/>
  </circle>
  <circle r="1" fill="#ffffff" opacity="0.3">
    <animate attributeName="cx" values="600;200;600" dur="15s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="60;30;60" dur="15s" repeatCount="indefinite"/>
  </circle>
</svg>
