name: Snake

on:
  schedule: [{cron: "0 5 * * *"}]
  workflow_dispatch:
  push: {branches: [main]}

jobs:
  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: P1p2gamer26
          outputs: |
            dist/snake.svg?color_snake=%2303787C&color_dots=%23161b22,%23036c56,%2313a06f,%2326d97f,%234ff0a0
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
