<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280">
  <defs>
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#03787C;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#014446;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ED8B00;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7F52FF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#5B3FD4;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="barGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3776AB;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2A5A85;stop-opacity:0.8"/>
    </linearGradient>
    <filter id="barGlow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="600" height="280" fill="#0d1117" rx="12"/>
  
  <!-- Title -->
  <text x="300" y="35" text-anchor="middle" font-family="JetBrains Mono, Fira Code, monospace" font-size="16" font-weight="bold" fill="#03787C">
    ⚡ SKILL LEVELS
  </text>
  
  <!-- Java -->
  <text x="30" y="75" font-family="JetBrains Mono, Fira Code, monospace" font-size="11" fill="#c9d1d9">Java</text>
  <rect x="120" y="63" width="450" height="16" fill="#161b22" rx="8"/>
  <rect x="120" y="63" width="0" height="16" fill="url(#barGrad2)" rx="8" filter="url(#barGlow)">
    <animate attributeName="width" from="0" to="405" dur="1.5s" fill="freeze" begin="0.3s"/>
  </rect>
  <text x="535" y="75" font-family="JetBrains Mono, Fira Code, monospace" font-size="10" fill="#c9d1d9" opacity="0">
    90%
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1.5s"/>
  </text>
  
  <!-- Python -->
  <text x="30" y="115" font-family="JetBrains Mono, Fira Code, monospace" font-size="11" fill="#c9d1d9">Python</text>
  <rect x="120" y="103" width="450" height="16" fill="#161b22" rx="8"/>
  <rect x="120" y="103" width="0" height="16" fill="url(#barGrad4)" rx="8" filter="url(#barGlow)">
    <animate attributeName="width" from="0" to="382" dur="1.5s" fill="freeze" begin="0.6s"/>
  </rect>
  <text x="535" y="115" font-family="JetBrains Mono, Fira Code, monospace" font-size="10" fill="#c9d1d9" opacity="0">
    85%
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1.8s"/>
  </text>
  
  <!-- Kotlin -->
  <text x="30" y="155" font-family="JetBrains Mono, Fira Code, monospace" font-size="11" fill="#c9d1d9">Kotlin</text>
  <rect x="120" y="143" width="450" height="16" fill="#161b22" rx="8"/>
  <rect x="120" y="143" width="0" height="16" fill="url(#barGrad3)" rx="8" filter="url(#barGlow)">
    <animate attributeName="width" from="0" to="292" dur="1.5s" fill="freeze" begin="0.9s"/>
  </rect>
  <text x="535" y="155" font-family="JetBrains Mono, Fira Code, monospace" font-size="10" fill="#c9d1d9" opacity="0">
    65%
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="2.1s"/>
  </text>
  
  <!-- Spring Boot -->
  <text x="30" y="195" font-family="JetBrains Mono, Fira Code, monospace" font-size="11" fill="#c9d1d9">Spring Boot</text>
  <rect x="120" y="183" width="450" height="16" fill="#161b22" rx="8"/>
  <rect x="120" y="183" width="0" height="16" fill="url(#barGrad1)" rx="8" filter="url(#barGlow)">
    <animate attributeName="width" from="0" to="360" dur="1.5s" fill="freeze" begin="1.2s"/>
  </rect>
  <text x="535" y="195" font-family="JetBrains Mono, Fira Code, monospace" font-size="10" fill="#c9d1d9" opacity="0">
    80%
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="2.4s"/>
  </text>
  
  <!-- AI/ML -->
  <text x="30" y="235" font-family="JetBrains Mono, Fira Code, monospace" font-size="11" fill="#c9d1d9">AI / ML</text>
  <rect x="120" y="223" width="450" height="16" fill="#161b22" rx="8"/>
  <rect x="120" y="223" width="0" height="16" fill="url(#barGrad1)" rx="8" filter="url(#barGlow)">
    <animate attributeName="width" from="0" to="315" dur="1.5s" fill="freeze" begin="1.5s"/>
  </rect>
  <text x="535" y="235" font-family="JetBrains Mono, Fira Code, monospace" font-size="10" fill="#c9d1d9" opacity="0">
    70%
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="2.7s"/>
  </text>
  
  <!-- Mobile -->
  <text x="30" y="265" font-family="JetBrains Mono, Fira Code, monospace" font-size="11" fill="#8b949e">Mobile (Kotlin)</text>
  <rect x="120" y="253" width="450" height="16" fill="#161b22" rx="8"/>
  <rect x="120" y="253" width="0" height="16" fill="url(#barGrad3)" rx="8" filter="url(#barGlow)">
    <animate attributeName="width" from="0" to="247" dur="1.5s" fill="freeze" begin="1.8s"/>
  </rect>
  <text x="535" y="265" font-family="JetBrains Mono, Fira Code, monospace" font-size="10" fill="#c9d1d9" opacity="0">
    55%
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="3s"/>
  </text>
</svg>
