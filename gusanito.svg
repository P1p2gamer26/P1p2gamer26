<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150" role="img" aria-label="Gusanito animado">
  <defs>
    <radialGradient id="segGrad" cx="50%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#2ff5d8"/>
      <stop offset="55%" stop-color="#038e86"/>
      <stop offset="100%" stop-color="#024a48"/>
    </radialGradient>
    <radialGradient id="segGrad2" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#16c9b4"/>
      <stop offset="60%" stop-color="#02706a"/>
      <stop offset="100%" stop-color="#013d3b"/>
    </radialGradient>
    <radialGradient id="headGrad" cx="38%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#53ffee"/>
      <stop offset="55%" stop-color="#07a79e"/>
      <stop offset="100%" stop-color="#026e69"/>
    </radialGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38ffea" stop-opacity="0.38"/>
      <stop offset="70%" stop-color="#38ffea" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38ffea" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadowG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#042828" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#042828" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#042828" stop-opacity="0"/>
    </radialGradient>

    <style>
      @keyframes bobA {
        0%,100% { transform: translateY(0) rotate(0deg) }
        22% { transform: translateY(-8px) rotate(-3deg) }
        60% { transform: translateY(4px) rotate(3deg) }
      }
      @keyframes bobB {
        0%,100% { transform: translateY(0) rotate(0deg) }
        22% { transform: translateY(4px) rotate(3deg) }
        60% { transform: translateY(-8px) rotate(-3deg) }
      }
      @keyframes headBob {
        0%,100% { transform: translateY(0) rotate(0deg) }
        20% { transform: translateY(-10px) rotate(4deg) }
        50% { transform: translateY(-2px) rotate(-3deg) }
        75% { transform: translateY(3px) rotate(2deg) }
      }
      @keyframes antWig { from { transform: rotate(13deg) } to { transform: rotate(-13deg) } }
      @keyframes blink { 0%,88%,100% { transform: scaleY(1) } 92%,95% { transform: scaleY(.12) } }
      @keyframes tw { 0%,100% { opacity:.12; transform: scale(.4) } 50% { opacity:1; transform: scale(1.05) } }
      @keyframes footL { 0%,100% { transform: rotate(-13deg) } 50% { transform: rotate(15deg) } }
      @keyframes footR { 0%,100% { transform: rotate(15deg) } 50% { transform: rotate(-13deg) } }
      @keyframes shad { 0%,100% { transform: scaleX(1) } 30% { transform: scaleX(1.25) } 70% { transform: scaleX(.92) } }
      @keyframes gloss { 0%,100% { opacity:.5 } 50% { opacity:.95 } }
      @keyframes tailWig { 0%,100% { transform: rotate(-8deg) } 50% { transform: rotate(8deg) } }
      @keyframes crawl { 0% { transform: translateX(-250px) } 100% { transform: translateX(1150px) } }
      @keyframes gnd { from { transform: translateX(0) } to { transform: translateX(-28px) } }

      .seg { animation-duration:1.1s; animation-timing-function:ease-in-out; animation-iteration-count:infinite }
      .bA { animation-name:bobA }
      .bB { animation-name:bobB }
      .d0 { animation-delay:0s }
      .d1 { animation-delay:.08s }
      .d2 { animation-delay:.16s }
      .d3 { animation-delay:.24s }
      .d4 { animation-delay:.32s }
      .d5 { animation-delay:.4s }
      .d6 { animation-delay:.48s }
      .d7 { animation-delay:.56s }
      .d8 { animation-delay:.64s }
      .d9 { animation-delay:.72s }
      .hd { animation:headBob 1.1s ease-in-out infinite }
      .ant { animation:antWig .5s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:bottom center }
      .eye { animation:blink 4.4s linear infinite; transform-box:fill-box; transform-origin:center }
      .worm { animation:crawl 16s linear infinite; transform-box:view-box; transform-origin:0 50% }
      .tail { animation:tailWig 1.1s ease-in-out .7s infinite }
      .shadow { animation:shad 1.1s ease-in-out infinite; transform-box:fill-box; transform-origin:center }
      .gloss { animation:gloss 1.1s ease-in-out infinite }
      .fL { animation:footL 1.1s ease-in-out infinite; transform-box:fill-box; transform-origin:top center }
      .fR { animation:footR 1.1s ease-in-out infinite; transform-box:fill-box; transform-origin:top center }
      .ground { animation:gnd 1.5s linear infinite }
      .spark { transform-box:fill-box; transform-origin:center }
      .s1 { animation:tw 2.2s ease-in-out infinite }
      .s2 { animation:tw 2.8s ease-in-out .5s infinite }
      .s3 { animation:tw 3s ease-in-out 1.1s infinite }
      .s4 { animation:tw 2.5s ease-in-out .2s infinite }
      .s5 { animation:tw 3.4s ease-in-out 1.6s infinite }
      .s6 { animation:tw 2.7s ease-in-out .9s infinite }
      .s7 { animation:tw 3.2s ease-in-out 1.3s infinite }
      @media (prefers-reduced-motion: reduce) {
        .worm { animation:none; transform: translateX(450px) }
        .hd,.seg,.ant,.eye,.tail,.shadow,.gloss,.fL,.fR,.ground,.spark { animation:none }
      }
    </style>
  </defs>

  <path class="ground" d="M-400 124 L 1600 124" fill="none" stroke="#03787c" stroke-width="2" stroke-dasharray="10 18" stroke-linecap="round" opacity=".2"/>

  <g class="worm">
    <ellipse class="shadow" cx="-76" cy="112" rx="62" ry="6.5" fill="url(#shadowG)"/>

    <g class="tail" style="transform-origin:-165px 78px">
      <circle cx="-165" cy="78" r="7" fill="url(#segGrad2)" stroke="#02403e" stroke-width="1"/>
      <ellipse class="gloss" cx="-163" cy="73.7" rx="3" ry="1.5" fill="#7fe8dc" opacity=".6"/>
    </g>

    <g class="seg bA d9" style="transform-origin:-154px 78px">
      <circle cx="-154" cy="78" r="9" fill="url(#segGrad)" stroke="#02403e" stroke-width="1"/>
      <ellipse class="gloss" cx="-152" cy="72.4" rx="3.6" ry="1.8" fill="#baf6ee" opacity=".6"/>
      <rect class="fL d9" x="-160.75" y="87.65" width="3.6" height="8" rx="1.8" fill="#03514e"/>
      <rect class="fR d9" x="-150.85" y="87.65" width="3.6" height="8" rx="1.8" fill="#03514e"/>
    </g>

    <g class="seg bB d8" style="transform-origin:-141px 78px">
      <circle cx="-141" cy="78" r="10" fill="url(#segGrad2)" stroke="#02403e" stroke-width="1"/>
      <ellipse class="gloss" cx="-139" cy="71.8" rx="4" ry="2" fill="#7fe8dc" opacity=".6"/>
      <rect class="fL d8" x="-148.3" y="88.5" width="3.6" height="8" rx="1.8" fill="#03514e"/>
      <rect class="fR d8" x="-137.3" y="88.5" width="3.6" height="8" rx="1.8" fill="#03514e"/>
    </g>

    <g class="seg bA d7" style="transform-origin:-127px 78px">
      <circle cx="-127" cy="78" r="11" fill="url(#segGrad)" stroke="#02403e" stroke-width="1"/>
      <ellipse class="gloss" cx="-125" cy="71.2" rx="4.4" ry="2.2" fill="#baf6ee" opacity=".6"/>
      <rect class="fL d7" x="-134.85" y="89.35" width="3.6" height="8" rx="1.8" fill="#03514e"/>
      <rect class="fR d7" x="-122.75" y="89.35" width="3.6" height="8" rx="1.8" fill="#03514e"/>
    </g>

    <g class="seg bB d6" style="transform-origin:-112px 78px">
      <circle cx="-112" cy="78" r="12" fill="url(#segGrad2)" stroke="#02403e" stroke-width="1"/>
      <ellipse class="gloss" cx="-110" cy="70.6" rx="4.8" ry="2.4" fill="#7fe8dc" opacity=".6"/>
      <rect class="fL d6" x="-120.4" y="90.2" width="3.6" height="8" rx="1.8" fill="#03514e"/>
      <rect class="fR d6" x="-107.2" y="90.2" width="3.6" height="8" rx="1.8" fill="#03514e"/>
    </g>

    <g class="seg bA d5" style="transform-origin:-96px 78px">
      <circle cx="-96" cy="78" r="13" fill="url(#segGrad)" stroke="#02403e" stroke-width="1"/>
      <ellipse class="gloss" cx="-94" cy="69.9" rx="5.2" ry="2.6" fill="#baf6ee" opacity=".6"/>
      <rect class="fL d5" x="-104.95" y="91.05" width="3.6" height="8" rx="1.8" fill="#03514e"/>
      <rect class="fR d5" x="-90.65" y="91.05" width="3.6" height="8" rx="1.8" fill="#03514e"/>
    </g>

    <g class="seg bB d4" style="transform-origin:-79px 78px">
      <circle cx="-79" cy="78" r="14" fill="url(#segGrad2)" stroke="#02403e" stroke-width="1"/>
      <ellipse class="gloss" cx="-77" cy="69.3" rx="5.6" ry="2.8" fill="#7fe8dc" opacity=".6"/>
      <rect class="fL d4" x="-88.5" y="91.9" width="3.6" height="8" rx="1.8" fill="#03514e"/>
      <rect class="fR d4" x="-73.1" y="91.9" width="3.6" height="8" rx="1.8" fill="#03514e"/>
    </g>

    <g class="seg bA d3" style="transform-origin:-61px 78px">
      <circle cx="-61" cy="78" r="15" fill="url(#segGrad)" stroke="#02403e" stroke-width="1"/>
      <ellipse class="gloss" cx="-59" cy="68.7" rx="6" ry="3" fill="#baf6ee" opacity=".6"/>
      <rect class="fL d3" x="-71.05" y="92.75" width="3.6" height="8" rx="1.8" fill="#03514e"/>
      <rect class="fR d3" x="-54.55" y="92.75" width="3.6" height="8" rx="1.8" fill="#03514e"/>
    </g>

    <g class="seg bB d2" style="transform-origin:-42px 78px">
      <circle cx="-42" cy="78" r="16" fill="url(#segGrad2)" stroke="#02403e" stroke-width="1"/>
      <ellipse class="gloss" cx="-40" cy="68.1" rx="6.4" ry="3.2" fill="#7fe8dc" opacity=".6"/>
      <rect class="fL d2" x="-52.6" y="93.6" width="3.6" height="8" rx="1.8" fill="#03514e"/>
      <rect class="fR d2" x="-35" y="93.6" width="3.6" height="8" rx="1.8" fill="#03514e"/>
    </g>

    <g class="seg bA d1" style="transform-origin:-22px 78px">
      <circle cx="-22" cy="78" r="17" fill="url(#segGrad)" stroke="#02403e" stroke-width="1"/>
      <ellipse class="gloss" cx="-20" cy="67.5" rx="6.8" ry="3.4" fill="#baf6ee" opacity=".6"/>
      <rect class="fL d1" x="-33.2" y="94.45" width="3.6" height="8" rx="1.8" fill="#03514e"/>
      <rect class="fR d1" x="-14.4" y="94.45" width="3.6" height="8" rx="1.8" fill="#03514e"/>
    </g>

    <g class="hd" style="transform-origin:0 78px">
      <circle cx="0" cy="78" r="26" fill="url(#glowGrad)"/>
      <circle cx="0" cy="78" r="19" fill="url(#headGrad)" stroke="#02403e" stroke-width="1"/>
      <ellipse class="gloss" cx="-3" cy="67" rx="9" ry="5" fill="#e0fef9" opacity=".7"/>
      <g class="eye">
        <ellipse cx="-2" cy="66" rx="5.6" ry="6.2" fill="#ffffff"/>
        <circle cx="-1.2" cy="66" r="3.1" fill="#062b29"/>
        <circle cx="-1.9" cy="64.7" r="1.2" fill="#ffffff"/>
        <ellipse cx="10" cy="73" rx="4.4" ry="5" fill="#ffffff"/>
        <circle cx="10.8" cy="73.4" r="2.4" fill="#062b29"/>
        <circle cx="10.2" cy="72.3" r="0.9" fill="#ffffff"/>
      </g>
      <ellipse cx="-12" cy="80" rx="4.2" ry="2.6" fill="#ff9fb0" opacity=".45"/>
      <ellipse cx="4" cy="85" rx="3.6" ry="2.4" fill="#ff9fb0" opacity=".4"/>
      <path d="M-4 84.5 Q 3.5 90.5 10 85" stroke="#08312f" stroke-width="1.7" fill="none" stroke-linecap="round"/>
      <g class="ant">
        <line x1="-3" y1="63" x2="12" y2="34" stroke="#015f5a" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="12" cy="34" r="4.4" fill="#38ffea"/>
        <circle cx="12" cy="34" r="1.9" fill="#eafdfa" opacity=".85"/>
      </g>
      <g class="ant">
        <line x1="5" y1="64" x2="22" y2="43" stroke="#015f5a" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="22" cy="43" r="3.6" fill="#2ff2dc"/>
        <circle cx="22" cy="43" r="1.5" fill="#eafdfa" opacity=".85"/>
      </g>
      <rect class="fL d0" x="-7.8" y="97" width="3.8" height="8.5" rx="1.9" fill="#03514e"/>
      <rect class="fR d0" x="2.9" y="97" width="3.8" height="8.5" rx="1.9" fill="#03514e"/>
    </g>
  </g>

  <g class="spark s1" stroke="#f9a825" stroke-width="2.6" stroke-linecap="round">
    <line x1="143" y1="32" x2="157" y2="32"/>
    <line x1="150" y1="25" x2="150" y2="39"/>
  </g>
  <g class="spark s2" stroke="#4df5e2" stroke-width="2.6" stroke-linecap="round">
    <line x1="473" y1="122" x2="487" y2="122"/>
    <line x1="480" y1="115" x2="480" y2="129"/>
  </g>
  <g class="spark s3" stroke="#f9a825" stroke-width="2.2" stroke-linecap="round">
    <line x1="694" y1="42" x2="706" y2="42"/>
    <line x1="700" y1="36" x2="700" y2="48"/>
  </g>
  <circle class="spark s4" cx="845" cy="96" r="3.5" fill="#4df5e2" stroke="none"/>
  <circle class="spark s5" cx="270" cy="22" r="2.6" fill="#9be3da" stroke="none"/>
  <circle class="spark s6" cx="600" cy="120" r="2.8" fill="#f9a825" stroke="none"/>
  <circle class="spark s7" cx="385" cy="26" r="2.4" fill="#4df5e2" stroke="none"/>
</svg>