<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150" role="img" aria-label="Oruga animada">
  <defs>
    <radialGradient id="segGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#17e0ca"/>
      <stop offset="55%" stop-color="#049e95"/>
      <stop offset="100%" stop-color="#026a66"/>
    </radialGradient>
    <radialGradient id="segGrad2" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#12b3a8"/>
      <stop offset="100%" stop-color="#024f4d"/>
    </radialGradient>
    <radialGradient id="headGrad" cx="40%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#23f0d8"/>
      <stop offset="60%" stop-color="#038e86"/>
      <stop offset="100%" stop-color="#015854"/>
    </radialGradient>
    <radialGradient id="tailGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0ca8a0"/>
      <stop offset="100%" stop-color="#01504e"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadowBlur" x="-60%" y="-200%" width="220%" height="400%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <path id="crawlPath" d="M-140 78 C 60 30, 240 128, 460 78 S 720 30, 1040 78" fill="none"/>

    <style>
      @keyframes bob1 { 0%,100%{transform:translateY(0) rotate(0deg)} 25%{transform:translateY(-7px) rotate(-4deg)} 75%{transform:translateY(3px) rotate(4deg)} }
      @keyframes bob2 { 0%,100%{transform:translateY(0) rotate(0deg)} 25%{transform:translateY(3px) rotate(4deg)} 75%{transform:translateY(-7px) rotate(-4deg)} }
      @keyframes headBob { 0%,100%{transform:translateY(0) rotate(0deg)} 30%{transform:translateY(-10px) rotate(6deg)} 60%{transform:translateY(2px) rotate(-3deg)} }
      @keyframes antenna { 0%,100%{transform:rotate(20deg)} 50%{transform:rotate(-24deg)} }
      @keyframes shadowPulse { 0%,100%{transform:scaleX(1) scaleY(1)} 30%{transform:scaleX(1.35) scaleY(0.7)} 70%{transform:scaleX(0.85) scaleY(1.15)} }
      @keyframes twinkle { 0%,100%{opacity:.15; transform:scale(.4)} 50%{opacity:1; transform:scale(1)} }
      @keyframes footL { 0%,100%{transform:rotate(-16deg)} 50%{transform:rotate(20deg)} }
      @keyframes footR { 0%,100%{transform:rotate(16deg)} 50%{transform:rotate(-20deg)} }
      @keyframes eyeBlink { 0%,88%,100%{transform:scaleY(1)} 92%,96%{transform:scaleY(.15)} }

      .seg { animation:bob1 1.15s ease-in-out infinite; transform-box:fill-box; transform-origin:center }
      .seg5 { animation-duration:1.15s; animation-delay:.14s; }
      .seg6 { animation:bob2 1.15s ease-in-out infinite; animation-delay:.3s; transform-box:fill-box; transform-origin:center }
      .seg7 { animation-duration:1.15s; animation-delay:.46s; }
      .seg8 { animation:bob2 1.3s ease-in-out infinite; animation-delay:.62s; transform-box:fill-box; transform-origin:center }
      .seg9 { animation-duration:1.3s; animation-delay:.78s; }
      .seg10 { animation:bob2 1.3s ease-in-out infinite; animation-delay:.94s; transform-box:fill-box; transform-origin:center }
      .seg11 { animation-duration:1.3s; animation-delay:1.1s; }
      .tail { animation:bob2 1.45s ease-in-out infinite; animation-delay:1.24s; transform-box:fill-box; transform-origin:center }
      .hd { animation:headBob 1.15s ease-in-out infinite; transform-box:fill-box; transform-origin:center }
      .ant { animation:antenna .55s ease-in-out infinite; transform-box:fill-box; transform-origin:bottom center }
      .eye { animation:eyeBlink 4s linear infinite; transform-box:fill-box; transform-origin:center }
      .shadow { animation:shadowPulse 1.15s ease-in-out infinite; transform-box:fill-box; transform-origin:center }
      .spark { animation:twinkle 2.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center }
      .spark2 { animation:twinkle 2.9s ease-in-out .7s infinite; transform-box:fill-box; transform-origin:center }
      .spark3 { animation:twinkle 3.3s ease-in-out 1.3s infinite; transform-box:fill-box; transform-origin:center }
      .footL { animation:footL 1.15s ease-in-out infinite; transform-box:fill-box; transform-origin:top center }
      .footR { animation:footR 1.15s ease-in-out infinite; transform-box:fill-box; transform-origin:top center }
    </style>
  </defs>

  <g>
    <animateMotion dur="16s" begin="0s" repeatCount="indefinite" rotate="auto">
      <mpath href="#crawlPath"/>
    </animateMotion>

    <ellipse class="shadow" cx="0" cy="112" rx="52" ry="7" fill="#00000033" filter="url(#shadowBlur)"/>

    <g class="tail">
      <circle cx="0" cy="78" r="9" fill="url(#tailGrad)" stroke="#01403e" stroke-width="1"/>
      <ellipse cx="0" cy="72" rx="4.5" ry="3" fill="#9ffff2" opacity=".55"/>
    </g>

    <g class="seg11">
      <circle cx="-20" cy="78" r="10" fill="url(#segGrad2)" stroke="#01403e" stroke-width="1"/>
      <ellipse cx="-20" cy="71.5" rx="5" ry="3.2" fill="#9ffff2" opacity=".55"/>
      <g class="footL"><rect x="-27" y="86" width="3.4" height="7" rx="1.7" fill="#026a66"/></g>
      <g class="footR"><rect x="-14" y="86" width="3.4" height="7" rx="1.7" fill="#026a66"/></g>
    </g>

    <g class="seg10">
      <circle cx="-41" cy="78" r="11" fill="url(#segGrad2)" stroke="#01403e" stroke-width="1"/>
      <ellipse cx="-41" cy="70.5" rx="5.5" ry="3.5" fill="#9ffff2" opacity=".6"/>
      <g class="footL"><rect x="-49" y="87" width="3.4" height="7" rx="1.7" fill="#026a66"/></g>
      <g class="footR"><rect x="-35" y="87" width="3.4" height="7" rx="1.7" fill="#026a66"/></g>
    </g>

    <g class="seg9">
      <circle cx="-63" cy="78" r="12" fill="url(#segGrad2)" stroke="#01403e" stroke-width="1"/>
      <ellipse cx="-63" cy="69.5" rx="6" ry="3.8" fill="#9ffff2" opacity=".6"/>
      <g class="footL"><rect x="-72" y="88" width="3.4" height="7" rx="1.7" fill="#026a66"/></g>
      <g class="footR"><rect x="-57" y="88" width="3.4" height="7" rx="1.7" fill="#026a66"/></g>
    </g>

    <g class="seg8">
      <circle cx="-86" cy="78" r="12.5" fill="url(#segGrad)" stroke="#024a48" stroke-width="1"/>
      <ellipse cx="-86" cy="68.5" rx="6.2" ry="4" fill="#b6fff4" opacity=".65"/>
      <g class="footL"><rect x="-95" y="88" width="3.4" height="7" rx="1.7" fill="#037069"/></g>
      <g class="footR"><rect x="-80" y="88" width="3.4" height="7" rx="1.7" fill="#037069"/></g>
    </g>

    <g class="seg7">
      <circle cx="-110" cy="78" r="13.5" fill="url(#segGrad)" stroke="#024a48" stroke-width="1"/>
      <ellipse cx="-110" cy="67.5" rx="6.8" ry="4.2" fill="#b6fff4" opacity=".65"/>
      <g class="footL"><rect x="-120" y="89" width="3.4" height="7" rx="1.7" fill="#037069"/></g>
      <g class="footR"><rect x="-104" y="89" width="3.4" height="7" rx="1.7" fill="#037069"/></g>
    </g>

    <g class="seg6">
      <circle cx="-135" cy="78" r="14.5" fill="url(#segGrad)" stroke="#024a48" stroke-width="1"/>
      <ellipse cx="-135" cy="66.5" rx="7.2" ry="4.5" fill="#c4fff7" opacity=".7"/>
      <g class="footL"><rect x="-146" y="90" width="3.4" height="7" rx="1.7" fill="#037069"/></g>
      <g class="footR"><rect x="-129" y="90" width="3.4" height="7" rx="1.7" fill="#037069"/></g>
    </g>

    <g class="seg5">
      <circle cx="-161" cy="78" r="15.5" fill="url(#segGrad)" stroke="#024a48" stroke-width="1"/>
      <ellipse cx="-161" cy="65" rx="7.8" ry="4.8" fill="#c4fff7" opacity=".7"/>
      <g class="footL"><rect x="-173" y="91" width="3.4" height="7" rx="1.7" fill="#037069"/></g>
      <g class="footR"><rect x="-155" y="91" width="3.4" height="7" rx="1.7" fill="#037069"/></g>
    </g>

    <g class="seg4">
      <circle cx="-188" cy="78" r="16.5" fill="url(#segGrad)" stroke="#024a48" stroke-width="1"/>
      <ellipse cx="-188" cy="63.5" rx="8.2" ry="5" fill="#d6fffb" opacity=".75"/>
      <g class="footL"><rect x="-201" y="92" width="3.4" height="7" rx="1.7" fill="#037069"/></g>
      <g class="footR"><rect x="-182" y="92" width="3.4" height="7" rx="1.7" fill="#037069"/></g>
    </g>

    <g class="hd">
      <g class="ant">
        <line x1="-18" y1="-16" x2="-34" y2="-38" stroke="#015f5a" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="-34" cy="-38" r="4" fill="#23f0d8"/>
      </g>
      <g class="ant">
        <line x1="-4" y1="-18" x2="-4" y2="-42" stroke="#015f5a" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="-4" cy="-42" r="4" fill="#23f0d8"/>
      </g>
      <circle cx="-12" cy="78" r="18" fill="url(#headGrad)" stroke="#024a48" stroke-width="1" filter="url(#softGlow)"/>
      <ellipse cx="-20" cy="68" rx="9.5" ry="6" fill="#e2fffb" opacity=".85"/>
      <g class="eye">
        <circle cx="-19" cy="72" r="4.4" fill="#062b29"/>
        <circle cx="-20.4" cy="70.8" r="1.5" fill="#ffffff"/>
      </g>
      <path d="M-8.5 82.5 q3 3.2 7 .2" stroke="#062b29" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <g class="footL"><rect x="-28" y="94" width="3.6" height="7" rx="1.8" fill="#037069"/></g>
      <g class="footR"><rect x="-7" y="94" width="3.6" height="7" rx="1.8" fill="#037069"/></g>
    </g>
  </g>

  <g class="spark" stroke="#f9a825" stroke-width="2.4" stroke-linecap="round">
    <line x1="150" y1="28" x2="162" y2="28"/>
    <line x1="156" y1="22" x2="156" y2="34"/>
  </g>
  <g class="spark2" stroke="#23f0d8" stroke-width="2.4" stroke-linecap="round">
    <line x1="480" y1="120" x2="492" y2="120"/>
    <line x1="486" y1="114" x2="486" y2="126"/>
  </g>
  <g class="spark3" stroke="#f9a825" stroke-width="2" stroke-linecap="round">
    <circle cx="700" cy="38" r="3" fill="#f9a825" stroke="none"/>
  </g>
  <g class="spark2" stroke="#23f0d8" stroke-width="2" stroke-linecap="round">
    <circle cx="840" cy="95" r="3" fill="#23f0d8" stroke="none"/>
  </g>
</svg>